<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shaderBoi remote</title>
<style>
@font-face {
  font-family: "Vulf Mono";
  src: url("fonts/VulfMono-Regular.woff2") format("woff2");
  font-weight: 400;
}
@font-face {
  font-family: "Vulf Mono";
  src: url("fonts/VulfMono-Bold.otf") format("opentype");
  font-weight: 700;
}
:root {
  --ink: #000;
  --line: rgba(0,255,0,0.42);
  --line-dim: rgba(0,255,0,0.22);
  --acc: #00ff00;
  --acc-soft: rgba(0,255,0,0.12);
  --text: #00ff00;
  --text-dim: rgba(0,255,0,0.6);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: var(--ink);
  color: var(--text);
  font-family: "Vulf Mono", monospace;
  height: 100%;
  user-select: none;
}
body {
  padding: 0.9rem;
  overflow-y: auto;
  background-image: repeating-linear-gradient(to bottom,
    rgba(0,255,0,0.03) 0 1px, transparent 1px 3px);
}
h1 {
  font-size: 0.8rem;
  letter-spacing: 0.3em;
  font-weight: 700;
  margin-bottom: 0.2rem;
  text-shadow: 0 0 10px rgba(0,255,0,0.45);
}
.sub { font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.14em; margin-bottom: 1rem; }
.section {
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  font-weight: 700;
  color: var(--acc);
  border-top: 1px solid var(--line-dim);
  padding-top: 0.7rem;
  margin: 0.9rem 0 0.5rem;
}
ul { list-style: none; }
li {
  font-size: 0.74rem;
  padding: 0.55rem 0.6rem;
  margin-bottom: 0.25rem;
  border: 1px solid transparent;
  border-radius: 4px;
  color: var(--text-dim);
  cursor: pointer;
}
li:hover { border-color: var(--line-dim); color: var(--text); }
li.active {
  color: var(--acc);
  border-color: var(--line);
  background: var(--acc-soft);
}
li.active::before { content: "\25B8 "; }
.row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.6rem; }
button {
  font-family: inherit;
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  background: var(--ink);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.6rem 0.9rem;
  cursor: pointer;
  flex: 1;
}
button:hover { border-color: var(--acc); background: var(--acc-soft); }
button.on { background: var(--acc-soft); color: var(--acc); border-color: var(--acc); }
input[type=range] {
  flex: 1;
  appearance: none; -webkit-appearance: none;
  height: 2px;
  background: var(--line);
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  appearance: none; -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--acc);
  border: 1px solid var(--ink);
  box-shadow: 0 0 6px rgba(0,255,0,0.5);
  cursor: grab;
}
label { font-size: 0.6rem; letter-spacing: 0.16em; color: var(--text-dim); }
.val { color: var(--acc); font-size: 0.66rem; min-width: 2ch; text-align: right; }
.mrow { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.35rem; }
.mrow label { width: 3.6em; flex: none; }
.meter {
  flex: 1;
  height: 6px;
  border: 1px solid var(--line-dim);
  border-radius: 3px;
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  width: 0%;
  background: var(--acc);
  box-shadow: 0 0 8px rgba(0,255,0,0.6);
  transition: width 0.08s linear;
}
.meter-fill.dim { background: var(--line); box-shadow: none; transition: width 0.25s linear; }
.clip {
  font-size: 0.56rem; letter-spacing: 0.2em;
  padding: 0.2rem 0.5rem;
  border: 1px solid var(--line-dim); border-radius: 3px;
  color: var(--text-dim); opacity: 0.35;
}
.clip.hit { opacity: 1; color: var(--ink); background: var(--acc); border-color: var(--acc); box-shadow: 0 0 10px var(--acc); }
button.recording { color: var(--acc); border-color: var(--acc); background: var(--acc-soft); }
.beat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  border: 1px solid var(--line);
  transition: background 0.05s, box-shadow 0.05s;
}
.beat-dot.hit { background: var(--acc); box-shadow: 0 0 10px var(--acc); }
.fx-list { display: flex; flex-direction: column; gap: 0.35rem; margin: 0.4rem 0 0.6rem; }
.fx-head {
  font-size: 0.54rem; letter-spacing: 0.26em; color: var(--text-dim);
  margin-top: 0.3rem; padding-top: 0.3rem; border-top: 1px dashed var(--line-dim);
}
.fx-head:first-child { margin-top: 0; padding-top: 0; border-top: none; }
.fx-row { display: flex; align-items: center; gap: 0.5rem; }
.chk {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 0.45rem;
  font-size: 0.64rem; letter-spacing: 0.1em; color: var(--acc); cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fx-row.off .chk { color: var(--text-dim); }
.chk input { accent-color: var(--acc); margin: 0; }
.fx-row input[type=range] { flex: none; width: 90px; }
.fx-row .val { width: 3.4em; }
.fx-row.off input[type=range], .fx-row.off .val { opacity: 0.35; }
#waiting {
  font-size: 0.66rem;
  color: var(--text-dim);
  border: 1px dashed var(--line-dim);
  border-radius: 4px;
  padding: 0.9rem;
  text-align: center;
  line-height: 1.7;
}
.hidden { display: none !important; }
</style>
</head>
<body>
<h1>SHADERBOI REMOTE</h1>
<div class="sub">CONTROLS THE MAIN WINDOW</div>

<div id="waiting">Waiting for the shaderBoi window&hellip;<br>Keep it open in this browser.</div>

<div id="panel" class="hidden">
  <div class="row">
    <button id="playBtn">PAUSE</button>
    <button id="stageToggleBtn">STAGE OFF</button>
  </div>

  <div class="section">SHADERS</div>
  <ul id="shaders"></ul>

  <div class="section">PRESETS</div>
  <ul id="presets"></ul>

  <div class="section">AUDIO REACT</div>
  <div class="row"><button id="audioBtn">MIC OFF</button></div>
  <div class="row">
    <label>SENS</label>
    <input type="range" id="sens" min="1" max="30" value="10">
    <span class="val" id="sensVal">10</span>
  </div>
  <div class="row" title="How much reactions duck when it sounds like talking, not music">
    <label>FOCUS</label>
    <input type="range" id="focus" min="0" max="100" value="70">
    <span class="val" id="focusVal">70</span>
  </div>
  <div class="row" title="How lazily effects follow the sound: 0 twitchy, 100 gliding">
    <label>SMOOTH</label>
    <input type="range" id="smooth" min="0" max="100" value="40">
    <span class="val" id="smoothVal">40</span>
  </div>
  <div class="mrow"><label>MUSIC</label><div class="meter"><div class="meter-fill dim" id="mMusic"></div></div></div>
  <div class="row" style="margin-top:0.6rem">
    <button id="adaptBtn" title="Normalise to the room's loudness and remove the crowd-noise floor">ADAPT ON</button>
    <button id="recordBtn" title="Record 45s of the mic + analysis log to the main window's downloads, for tuning">RECORD 45s</button>
  </div>
  <div class="row"><span id="clipBadge" class="clip">CLIP</span></div>
  <div class="section">EFFECTS — ON / STRENGTH</div>
  <div class="fx-list" id="fxGrid"></div>
  <div class="row">
    <button id="fxNoneBtn">NONE</button>
    <button id="fxDefaultsBtn">DEFAULTS</button>
  </div>
  <div class="mrow"><label>LEVEL</label><div class="meter"><div class="meter-fill" id="mLevel"></div></div></div>
  <div class="mrow"><label>BASS</label><div class="meter"><div class="meter-fill" id="mBass"></div></div></div>
  <div class="mrow"><label>MID</label><div class="meter"><div class="meter-fill" id="mMid"></div></div></div>
  <div class="mrow"><label>TREB</label><div class="meter"><div class="meter-fill" id="mTreb"></div></div></div>
  <div class="mrow"><label>BEAT</label><div class="beat-dot" id="beatDot"></div></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ch = new BroadcastChannel('shaderboi-ctl');
  let state = null;
  let sensDragging = false;
  let focusDragging = false;
  let smoothDragging = false;

  const send = (msg) => ch.postMessage(msg);

  function render() {
    if (!state) return;
    $('waiting').classList.add('hidden');
    $('panel').classList.remove('hidden');

    $('playBtn').textContent = state.playing ? 'PAUSE' : 'PLAY';
    $('stageToggleBtn').textContent = state.stage ? 'STAGE ON' : 'STAGE OFF';
    $('stageToggleBtn').classList.toggle('on', state.stage);
    $('audioBtn').textContent = state.audio.on ? 'MIC LIVE' : 'MIC OFF';
    $('audioBtn').classList.toggle('on', state.audio.on);
    if (!sensDragging) {
      $('sens').value = state.audio.sens;
      $('sensVal').textContent = state.audio.sens;
    }
    if (!focusDragging && Number.isFinite(state.audio.focus)) {
      $('focus').value = state.audio.focus;
      $('focusVal').textContent = state.audio.focus;
    }
    if (!smoothDragging && Number.isFinite(state.audio.smooth)) {
      $('smooth').value = state.audio.smooth;
      $('smoothVal').textContent = state.audio.smooth;
    }
    $('adaptBtn').textContent = state.audio.adapt === false ? 'ADAPT OFF' : 'ADAPT ON';
    $('adaptBtn').classList.toggle('on', state.audio.adapt !== false);
    $('recordBtn').textContent = state.audio.recording ? 'RECORDING… STOP' : 'RECORD 45s';
    $('recordBtn').classList.toggle('recording', !!state.audio.recording);
    $('recordBtn').disabled = !(state.audio.on && state.audio.source === 'mic');
    renderFx(state);

    const ul = $('shaders');
    ul.innerHTML = '';
    for (const s of state.shaders) {
      const li = document.createElement('li');
      li.textContent = s.name;
      li.className = s.id === state.activeId ? 'active' : '';
      li.addEventListener('click', () => send({ cmd: 'setShader', id: s.id }));
      ul.appendChild(li);
    }

    const pl = $('presets');
    pl.innerHTML = '';
    for (const p of state.presets) {
      const li = document.createElement('li');
      li.textContent = p.name;
      li.addEventListener('click', () => send({ cmd: 'preset', file: p.file }));
      pl.appendChild(li);
    }
  }

  // effect rows are built once per definition set and then updated in place, so a
  // slider being dragged isn't rebuilt under the pointer by the echoed state
  let fxSig = '';
  let amtDragging = null;
  function renderFx(state) {
    const defs = state.fxDefs || [];
    const fx = state.audio.fx || {};
    const amt = state.audio.amt || {};
    const grid = $('fxGrid');
    const sig = defs.map(d => d.key).join(',');
    if (sig !== fxSig) {
      fxSig = sig;
      grid.innerHTML = '';
      let group = null;
      for (const d of defs) {
        if (d.group !== group) {
          group = d.group;
          const h = document.createElement('div');
          h.className = 'fx-head';
          h.textContent = group;
          grid.appendChild(h);
        }
        const row = document.createElement('div');
        row.className = 'fx-row';
        row.dataset.fx = d.key;
        const lab = document.createElement('label');
        lab.className = 'chk';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.addEventListener('change', () => send({ cmd: 'fx', key: d.key, on: cb.checked }));
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode(' ' + d.label));
        const sl = document.createElement('input');
        sl.type = 'range'; sl.min = 0; sl.max = 200; sl.step = 1;
        sl.addEventListener('pointerdown', () => { amtDragging = d.key; });
        sl.addEventListener('pointerup', () => { amtDragging = null; });
        sl.addEventListener('input', () => {
          row.querySelector('.val').textContent = sl.value + '%';
          send({ cmd: 'amt', key: d.key, value: sl.value / 100 });
        });
        const val = document.createElement('span');
        val.className = 'val';
        row.appendChild(lab); row.appendChild(sl); row.appendChild(val);
        grid.appendChild(row);
      }
    }
    grid.querySelectorAll('.fx-row').forEach(row => {
      const key = row.dataset.fx;
      row.classList.toggle('off', !fx[key]);
      row.querySelector('input[type=checkbox]').checked = !!fx[key];
      if (amtDragging !== key) {
        const pct = Math.round((amt[key] ?? 1) * 100);
        row.querySelector('input[type=range]').value = pct;
        row.querySelector('.val').textContent = pct + '%';
      }
    });
  }

  ch.onmessage = (e) => {
    const m = e.data || {};
    if (m.type === 'state') { state = m; render(); }
    if (m.type === 'level') {
      const pct = (v) => Math.round(Math.min(1, Math.max(0, v || 0)) * 100) + '%';
      $('mLevel').style.width = pct(m.v);
      $('mBass').style.width = pct(m.b);
      $('mMid').style.width = pct(m.m);
      $('mTreb').style.width = pct(m.t);
      $('beatDot').classList.toggle('hit', (m.beat || 0) > 0.5);
      $('mMusic').style.width = pct(m.music);
      $('clipBadge').classList.toggle('hit', !!m.clip);
    }
  };

  $('adaptBtn').addEventListener('click', () => send({ cmd: 'adapt', on: !(state && state.audio.adapt !== false) }));
  $('recordBtn').addEventListener('click', () => send({ cmd: 'record' }));

  $('smooth').addEventListener('pointerdown', () => { smoothDragging = true; });
  $('smooth').addEventListener('pointerup', () => { smoothDragging = false; });
  $('smooth').addEventListener('input', () => {
    $('smoothVal').textContent = $('smooth').value;
    send({ cmd: 'smooth', value: parseInt($('smooth').value, 10) });
  });
  $('focus').addEventListener('pointerdown', () => { focusDragging = true; });
  $('focus').addEventListener('pointerup', () => { focusDragging = false; });
  $('focus').addEventListener('input', () => {
    $('focusVal').textContent = $('focus').value;
    send({ cmd: 'focus', value: parseInt($('focus').value, 10) });
  });

  $('fxNoneBtn').addEventListener('click', () => send({ cmd: 'fxAll', defaults: false }));
  $('fxDefaultsBtn').addEventListener('click', () => send({ cmd: 'fxAll', defaults: true }));

  $('playBtn').addEventListener('click', () => send({ cmd: 'playpause' }));
  $('stageToggleBtn').addEventListener('click', () => send({ cmd: 'stage', on: !(state && state.stage) }));
  $('audioBtn').addEventListener('click', () => send({ cmd: 'audio', on: !(state && state.audio.on) }));
  $('sens').addEventListener('pointerdown', () => { sensDragging = true; });
  $('sens').addEventListener('pointerup', () => { sensDragging = false; });
  $('sens').addEventListener('input', () => {
    $('sensVal').textContent = $('sens').value;
    send({ cmd: 'sens', value: parseInt($('sens').value, 10) });
  });

  // announce until the main window responds, then keep a slow heartbeat
  send({ cmd: 'hello' });
  const helloTimer = setInterval(() => {
    send({ cmd: 'hello' });
    if (state) clearInterval(helloTimer);
  }, 1500);
})();
</script>
</body>
</html>
